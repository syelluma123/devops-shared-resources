name: Sync Branches CI

on:
  pull_request:
    paths:
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/sync-branches-tests.yml"
      - ".github/workflows/main-release-feasibility.yml"
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/sync-branches-tests.yml"
      - ".github/workflows/main-release-feasibility.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit and e2e tests
        run: pytest -v --cov=lib --cov=scripts --cov-report=term-missing
