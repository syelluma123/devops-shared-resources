apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://gitlab.cee.redhat.com/rhoai/private/odh-dashboard?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch == "rhoai-3.5"
  labels:
    appstudio.openshift.io/application: automation
    appstudio.openshift.io/component: odh-dashboard-v3-5
    pipelines.appstudio.openshift.io/type: build
  name: odh-dashboard-v3-5-on-push
  namespace: rhoai-private-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai-private/odh-dashboard-rhel9:rhoai-3.5
  - name: rhoai-version
    value: "3.5.0"
  - name: disable-slack-notifications
    value: "true"
  - name: dockerfile
    value: Dockerfile.konflux
  - name: path-context
    value: .
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: rhoai-3.5
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-dashboard
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
